name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # Runs the repo's own `test` script rather than a bare `bun test`, so
      # CI and local stay one source of truth. Note it is path-scoped
      # (bun test src plugins) — a test added outside those paths will not run here
      # until the script is widened.
      - run: bun run test

  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      - run: bun run lint
      - run: bunx tsc --noEmit
      - run: bunx expo export --platform web
        env:
          EXPO_PUBLIC_SUPABASE_URL: ${{ secrets.EXPO_PUBLIC_SUPABASE_URL }}
          EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY }}
          EXPO_PUBLIC_API_URL: ${{ secrets.EXPO_PUBLIC_API_URL }}
          EXPO_PUBLIC_COOKIE_DOMAIN: ${{ secrets.EXPO_PUBLIC_COOKIE_DOMAIN }}

  audit:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install
      # image-size is ignored, not fixed: both advisories cover <=2.0.2 and
      # 2.0.2 is the newest published release (the 1.x line tops out at the
      # equally-affected 1.2.1), so no override or upgrade can clear them.
      # It is reached only through metro's own tree -- expo > @expo/metro-config
      # > @expo/metro > metro, and react-native > @react-native/community-cli-plugin
      # > metro -- i.e. build tooling, never shipped app code. metro still
      # declares image-size ^1.0.2 as of 0.87.0, so bumping Expo will not help.
      # Drop both --ignore flags once image-size publishes a fixed version.
      # braces (GHSA-vfj7-8cjw-p6xm, <=3.0.3) is ignored for the same reason: the
      # advisory covers the newest published release, and braces is reached only
      # through micromatch (jest's transform and metro's file map): build tooling,
      # never shipped app code. Drop it once a fixed version exists.
      # decode-uri-component (GHSA-qr28-fpjm-wq7f, <=0.5.0) ships in the app, through
      # query-string 7 (expo-router, @react-navigation/core). The only fixed release,
      # 0.5.1, is an ES module, while query-string 7 require()s ^0.2.2 and calls it as
      # a function, so an override would break route parsing. The advisory is a
      # slowdown on a crafted, very long percent-encoded URL. Drop the flag once
      # expo-router and react-navigation move to a query-string on a fixed version.
      - run: >
          bun audit --audit-level=high
          --ignore GHSA-w3rx-r6r6-pgpr
          --ignore GHSA-5p2g-fcmc-qvqq
          --ignore GHSA-vfj7-8cjw-p6xm
          --ignore GHSA-qr28-fpjm-wq7f
